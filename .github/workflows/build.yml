# Builds the site on every push to main and deploys it to the personal-page-edge
# Cloudflare Worker, which serves leothe.dev (needs the CLOUDFLARE_API_TOKEN
# repository secret). It also publishes dist/ as a single commit on the `build`
# branch for the Raspberry Pi fallback, which polls that branch (see berteotti's
# web-pi repo: pi/pull-deploy.sh).
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run build

      - run: echo "$GITHUB_SHA" > dist/version.txt

      - name: Deploy dist/ to the personal-page-edge Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.164.0 deploy --env edge

      - name: Publish dist/ to the build branch
        run: |
          subject="$(git log -1 --format=%s)"
          cd dist
          git init -q -b build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_SHA::7}: $subject"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build
